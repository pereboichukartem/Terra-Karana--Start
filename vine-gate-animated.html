<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ліани-душителі</title>
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.cam{position:absolute;inset:0;transform:scale(1.03)}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}30%{opacity:calc(var(--a)*.4)}50%{opacity:var(--a)}75%{opacity:calc(var(--a)*.6)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;--fc:150,245,255;
 background:repeating-linear-gradient(180deg,rgba(var(--fc),0) 0 6px,rgba(var(--fc),.9) 6px 9px,rgba(var(--fc),0) 9px 16px);background-size:100% 32px;animation:fall 1.2s linear infinite;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.fall.l{--fc:255,190,70;animation-duration:2.6s}.fall.r{--fc:255,150,150;animation-duration:1.8s}.fall.v{--fc:230,150,255}
@keyframes fall{to{background-position:0 32px}}
.rays{position:absolute;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(var(--rc),.9) 0 3deg,transparent 3deg 12deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 32%);mask-image:radial-gradient(circle,#000 0,transparent 32%);animation:ry 120s linear infinite,rb 7s ease-in-out infinite alternate}
@keyframes ry{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes rb{from{opacity:calc(var(--ro)*.55)}to{opacity:var(--ro)}}
.fz{position:absolute;overflow:hidden;pointer-events:none}
.fog{position:absolute;left:-40%;width:180%;height:100%;mix-blend-mode:screen;animation:dr 46s linear infinite alternate}
@keyframes dr{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.spin{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;pointer-events:none;opacity:.42;
 background:repeating-conic-gradient(from 0deg,rgba(255,120,255,.85) 0 14deg,rgba(80,220,255,.7) 14deg 28deg,transparent 28deg 58deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 68%);mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 68%);animation:sp 16s linear infinite}
.spin.s2{opacity:.28;animation-duration:27s;animation-direction:reverse;background:repeating-conic-gradient(from 20deg,rgba(255,255,255,.85) 0 7deg,transparent 7deg 38deg)}
@keyframes sp{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.rays,.fog,.spin{animation:none}}
</style></head><body>

function dot(a,b,r,rgb,al){const g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,`rgba(${rgb},${al})`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(a-r,b-r,r*2,r*2)}
// спори
const S=C.spores,mkS=i=>{const s=S.src[i%S.src.length];return{x:s[0]*k+(R()-.5)*30,y:s[1]*k+(R()-.5)*14,vy:.12+R()*.3,p:R()*6,l:0,m:140+R()*180,c:s[2][R()*s[2].length|0],z:R()<.2?3:2}};

// мотики: float / ash / leaf
const MO=[],mkM=m=>{const b=m.box;return{m,x:(b[0]+R()*(b[2]-b[0]))*k,y:(b[1]+R()*(b[3]-b[1]))*k,p:R()*6,v:.05+R()*.15,z:R()<.25?3:2,c:m.mode==='leaf'?['#a6d62a','#5da02a','#d4e04a'][R()*3|0]:m.col}};

const ST=C.stars?Array.from({length:C.stars.n},()=>[(C.stars.box[0]+R()*(C.stars.box[2]-C.stars.box[0]))*k,(C.stars.box[1]+R()*(C.stars.box[3]-C.stars.box[1]))*k,R()*6]):[];

function frame(t){t=t||0;x.clearRect(0,0,CW,CH);

  if(m.mode==='float'){o.x+=Math.sin(o.p)*.15;o.y+=Math.cos(o.p*.8)*.1;dot(o.x,o.y,2.4,m.col,.35+.3*Math.sin(t/600+o.p*3))}
