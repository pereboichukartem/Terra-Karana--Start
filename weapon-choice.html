<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вибір зброї</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden;font-family:'Press Start 2P',ui-monospace,monospace}
.cam{position:absolute;inset:0;transform:scale(1.02)}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}35%{opacity:calc(var(--a)*.45)}60%{opacity:var(--a)}82%{opacity:calc(var(--a)*.7)}}
.title{position:absolute;left:0;right:0;top:10.4%;text-align:center;color:#aef6ff;font-size:clamp(9px,1.15vw,18px);letter-spacing:.2em;text-shadow:0 0 12px #19e0ff,0 3px 0 #04203a;pointer-events:none;animation:tb 2.4s steps(2) infinite}
@keyframes tb{50%{opacity:.7}}
.case{position:absolute;overflow:hidden;border:0;padding:0;background:transparent;cursor:pointer;outline:none;transition:background .4s,box-shadow .25s}
.case:hover,.case:focus-visible{background:radial-gradient(ellipse at 50% 55%,rgba(90,210,255,.22),transparent 72%);box-shadow:inset 0 0 50px rgba(70,200,255,.45),0 0 28px rgba(70,200,255,.4)}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(130,220,255,.15) 5px 6px);animation:hs 2.6s linear infinite}
@keyframes hs{to{background-position:0 -60px}}
.sweep{position:absolute;left:0;right:0;top:0;height:16%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(180deg,transparent,rgba(150,235,255,.28),transparent);animation:sw 3.6s linear infinite}
.case:nth-of-type(2) .sweep{animation-delay:-1.2s}.case:nth-of-type(3) .sweep{animation-delay:-2.4s}
@keyframes sw{from{transform:translateY(-110%)}to{transform:translateY(620%)}}
.name{position:absolute;left:0;right:0;bottom:5%;text-align:center;color:#fff;font-size:clamp(9px,1vw,16px);text-shadow:0 0 10px #19e0ff,0 3px 0 #04203a;opacity:0;transform:translateY(6px);transition:.25s}
.case:hover .name,.case:focus-visible .name,.case.picked .name{opacity:1;transform:none}
.chosen .case:not(.picked){background:rgba(2,3,16,.75);box-shadow:none;cursor:default}
.chosen .case:not(.picked) .name{opacity:0}
.case.picked{cursor:default;box-shadow:inset 0 0 70px rgba(120,230,255,.6),0 0 40px rgba(120,230,255,.6)}
.case.picked::before{content:'';position:absolute;left:30%;right:30%;top:0;bottom:0;mix-blend-mode:screen;background:linear-gradient(0deg,rgba(150,235,255,.95),transparent);transform-origin:50% 100%;animation:beam 1.4s ease-out both}
@keyframes beam{from{opacity:0;transform:scaleY(.1)}to{opacity:.75;transform:none}}
#flash{position:absolute;inset:0;background:#cfeeff;opacity:0;transition:opacity .7s;pointer-events:none}#flash.on{opacity:.85;transition:none}
#done{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(4,5,12,.78);color:#fff;font:14px 'Press Start 2P',monospace;text-align:center}
#done[hidden]{display:none}#done button{font:inherit;color:#fff;background:#0a1236;border:0;padding:14px 20px;cursor:pointer;box-shadow:0 -3px 0 #19e0ff,0 3px 0 #19e0ff,-3px 0 0 #19e0ff,3px 0 0 #19e0ff}
@media (prefers-reduced-motion:reduce){.g,.holo,.sweep,.title{animation:none}}
</style></head><body>

// вітрини в координатах canvas: [лівий,верх,правий,низ], центр зброї, кольори
const C={katana:{b:[172,70,318,340],c:[245,200],k:['#19e0ff','#aef6ff']},hammer:{b:[341,70,488,340],c:[419,190],k:['#ff3cc8','#19e0ff']},staff:{b:[520,70,666,340],c:[594,180],k:['#ff3cc8','#ffb0ef']}};
const ids=Object.keys(C);
const mk=i=>{const c=C[ids[i%3]],b=c.b;return{x:b[0]+8+R()*(b[2]-b[0]-16),y:b[3]-R()*30,vy:.15+R()*.4,p:R()*6,l:0,m:100+R()*140,c:c.k[R()*2|0],z:R()<.2?3:2}};
const P=Array.from({length:90},(_,i)=>{const p=mk(i);p.l=R()*p.m;return p});
const GL=[[545,185],[745,205],[935,205],[1190,172],[483,495],[838,628],[1188,625]],FX=[],SP=[];
let picked=null,shake=0;
function f(t){t=t||0;x.clearRect(0,0,CW,CH);
 P.forEach((p,i)=>{p.l++;p.y-=p.vy;p.x+=Math.sin(p.l/20+p.p)*.25;if(p.l>p.m)Object.assign(p,mk(i));x.globalAlpha=Math.sin(Math.PI*p.l/p.m)*.9;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.z,p.z)});
 if(R()<.05){const g=GL[R()*GL.length|0];FX.push({x:g[0]/2,y:g[1]/2,l:0})}
 x.fillStyle='#fff';
 for(let i=FX.length-1;i>=0;i--){const e=FX[i];if(++e.l>30){FX.splice(i,1);continue}const a=Math.round(5*Math.sin(Math.PI*e.l/30));x.globalAlpha=1;x.fillRect(e.x-a|0,e.y|0,a*2+1,1);x.fillRect(e.x|0,e.y-a|0,1,a*2+1)}
 for(let i=SP.length-1;i>=0;i--){const s=SP[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.06;if(--s.l<=0){SP.splice(i,1);continue}x.globalAlpha=Math.min(1,s.l/16);x.fillStyle=s.c;x.fillRect(s.x|0,s.y|0,s.z,s.z)}
 x.globalAlpha=1;
 cam.style.transform=`translate(${(Math.sin(t/1800)*1.5+(R()-.5)*14*shake).toFixed(1)}px,${(Math.cos(t/2200)*1.1+(R()-.5)*14*shake).toFixed(1)}px) scale(1.02)`;shake*=.9;
 if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f);

const cs=[...document.querySelectorAll('.case')],done=document.getElementById('done'),doneT=document.getElementById('doneT'),framed=window.parent!==window;
function pick(c){if(picked)return;picked=c.dataset.id;st.classList.add('chosen');c.classList.add('picked');shake=1;
 fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),80);
 const o=C[picked];for(let i=0;i<70;i++){const a=R()*6.28,s=.8+R()*3.2;SP.push({x:o.c[0],y:o.c[1],vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,l:30+R()*30,c:i%3?o.k[i%2]:'#fff',z:R()<.3?3:2})}
 setTimeout(()=>{if(framed)parent.postMessage({type:'choice',value:picked},'*');else{doneT.textContent='Ти обрав: '+c.dataset.name;done.hidden=false}},1700)}
cs.forEach(c=>c.addEventListener('click',()=>pick(c)));
addEventListener('keydown',e=>{if(picked)return;const i=cs.indexOf(document.activeElement);
 if(e.key==='ArrowRight')cs[(i+1)%3].focus();else if(e.key==='ArrowLeft')cs[(i+2)%3].focus()});
document.getElementById('again').onclick=()=>{picked=null;st.classList.remove('chosen');cs.forEach(c=>c.classList.remove('picked'));done.hidden=true};
