<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренувальна зала — анімація</title>
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.cam{position:absolute;inset:0;transform:scale(1.025)}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}35%{opacity:calc(var(--a)*.4)}60%{opacity:var(--a)}82%{opacity:calc(var(--a)*.65)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;
 background:repeating-linear-gradient(180deg,rgba(90,220,255,0) 0 6px,rgba(170,245,255,.9) 6px 9px,rgba(90,220,255,0) 9px 16px);background-size:100% 32px;animation:fall 1.1s linear infinite}
@keyframes fall{to{background-position:0 32px}}
.beam{position:absolute;left:49.7%;top:18%;width:.6%;height:23%;mix-blend-mode:screen;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,80,210,.0),rgba(255,120,230,.9) 40%,rgba(255,80,210,.1));animation:bm 2.2s ease-in-out infinite}
@keyframes bm{0%,100%{opacity:.5;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1.5)}}
.ring{position:absolute;left:49.9%;top:76.5%;width:36%;aspect-ratio:600/110;border:2px solid rgba(90,230,255,.85);border-radius:50%;box-shadow:0 0 14px rgba(60,200,255,.8),inset 0 0 14px rgba(60,200,255,.5);
 mix-blend-mode:screen;pointer-events:none;transform:translate(-50%,-50%) scale(.15);opacity:0;animation:rg 3.6s ease-out infinite}
@keyframes rg{0%{transform:translate(-50%,-50%) scale(.15);opacity:.95}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
.fz{position:absolute;left:26%;top:56%;width:48%;height:10%;overflow:hidden;pointer-events:none}
.fog{position:absolute;left:-40%;width:180%;height:100%;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 50%,rgba(200,150,255,.32),transparent 70%);animation:dr 44s linear infinite alternate}
@keyframes dr{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.beam,.ring,.fog{animation:none}}
</style></head><body>

const FS=[[315,565],[420,560],[1240,562],[1350,565],[88,735],[1583,735]];
const mk=i=>{const s=FS[i%6];return{x:s[0]/2+(R()-.5)*8,y:s[1]/2,vy:.35+R()*.6,p:R()*6,l:0,m:30+R()*40,c:['#19e0ff','#aef6ff','#6a8aff'][R()*3|0],z:R()<.25?3:2}};
const FP=Array.from({length:70},(_,i)=>{const p=mk(i);p.l=R()*p.m;return p});
// мішені: центри ядер, кольори, спалах
const CO=[[270,258,'255,90,220'],[344,260,'90,220,255'],[417,253,'90,220,255'],[488,260,'255,90,220'],[568,258,'90,220,255']],FL=[0,0,0,0,0],SP=[],SS=[];
let shake=0,nextHit=900;
function hit(i){FL[i]=1;shake=Math.max(shake,.3);const c=CO[i];for(let n=0;n<22;n++){const a=R()*6.28,s=.6+R()*2.4;SP.push({x:c[0],y:c[1],vx:Math.cos(a)*s,vy:Math.sin(a)*s-.8,l:20+R()*20,c:n%3?`rgb(${c[2]})`:'#fff',z:R()<.3?3:2})}}
function f(t){t=t||0;x.clearRect(0,0,CW,CH);
 ST.forEach(s=>{x.globalAlpha=.3+.6*Math.sin(t/500+s[2]);x.fillStyle='#dfe8ff';x.fillRect(s[0]|0,s[1]|0,1,1)});
 x.globalCompositeOperation='lighter';
 MO.forEach(m=>{m.x+=m.v;m.y+=Math.sin(t/1400+m.p)*.1;if(m.x>616)m.x=220;gl(m.x,m.y,2.5,m.c,.5+.3*Math.sin(t/600+m.p))});
 if(R()<.004)SS.push({x:600,y:90+R()*50,l:0});
 for(let i=SS.length-1;i>=0;i--){const s=SS[i];if(++s.l>28){SS.splice(i,1);continue}x.strokeStyle=`rgba(220,230,255,${1-s.l/28})`;x.lineWidth=1.2;x.beginPath();x.moveTo(s.x-s.l*5,s.y+s.l*2.2);x.lineTo(s.x-s.l*5+16,s.y+s.l*2.2-7);x.stroke()}
 CO.forEach((c,i)=>{if(FL[i]>.03){gl(c[0],c[1],34,c[2],FL[i]*.9);FL[i]*=.9}});
 x.globalCompositeOperation='source-over';
 FP.forEach((p,i)=>{p.l++;p.y-=p.vy;p.x+=Math.sin(p.l/6+p.p)*.35;if(p.l>p.m)Object.assign(p,mk(i));x.globalAlpha=Math.sin(Math.PI*p.l/p.m)*.9;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.z,p.z)});
 for(let i=SP.length-1;i>=0;i--){const s=SP[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.07;if(--s.l<=0){SP.splice(i,1);continue}x.globalAlpha=Math.min(1,s.l/12);x.fillStyle=s.c;x.fillRect(s.x|0,s.y|0,s.z,s.z)}
 x.globalAlpha=1;
 if(t>nextHit){hit(R()*5|0);nextHit=t+1300+R()*1700}
 cam.style.transform=`translate(${(Math.sin(t/2000)*1.6+(R()-.5)*10*shake).toFixed(1)}px,${(Math.cos(t/2400)*1.2+(R()-.5)*10*shake).toFixed(1)}px) scale(1.025)`;shake*=.9;
 if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
