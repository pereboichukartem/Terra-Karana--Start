<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поле мечів — анімація</title>
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 55%;animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.03)}to{transform:scale(1.07) translate(-.7%,.5%)}}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}35%{opacity:calc(var(--a)*.4)}60%{opacity:var(--a)}82%{opacity:calc(var(--a)*.65)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;
 background:repeating-linear-gradient(180deg,rgba(90,220,255,0) 0 6px,rgba(160,245,255,.9) 6px 9px,rgba(90,220,255,0) 9px 16px);background-size:100% 32px;animation:fall 1.2s linear infinite;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
@keyframes fall{to{background-position:0 32px}}
.rays{position:absolute;left:69.1%;top:40.2%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:repeating-conic-gradient(from 0deg,rgba(255,170,90,.9) 0 3deg,transparent 3deg 12deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 32%);mask-image:radial-gradient(circle,#000 0,transparent 32%);
 animation:ry 120s linear infinite,rb 7s ease-in-out infinite alternate}
@keyframes ry{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes rb{from{opacity:.12}to{opacity:.28}}
.fz{position:absolute;left:40%;top:50%;width:38%;height:14%;overflow:hidden;pointer-events:none}
.fog{position:absolute;left:-40%;width:180%;height:100%;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 50%,rgba(190,120,255,.32),transparent 70%);animation:dr 46s linear infinite alternate}
@keyframes dr{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@media (prefers-reduced-motion:reduce){.cam,.g,.fall,.rays,.fog{animation:none}}
</style></head><body>
