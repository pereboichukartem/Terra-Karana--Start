<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Верховна імперія — портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.cam{position:absolute;inset:0;will-change:transform;transform:scale(1.015)}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}35%{opacity:calc(var(--a)*.4)}60%{opacity:var(--a)}82%{opacity:calc(var(--a)*.65)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;
 background:repeating-linear-gradient(180deg,rgba(90,220,255,0) 0 5px,rgba(150,245,255,.9) 5px 8px,rgba(90,220,255,0) 8px 14px);background-size:100% 28px;animation:fall 1.1s linear infinite}
@keyframes fall{to{background-position:0 28px}}
.crt{position:absolute;inset:0;pointer-events:none;overflow:hidden;clip-path:polygon(19.3% 19.3%,54.7% 27.4%,56.1% 66.4%,17.9% 68%);animation:cf .22s steps(2) infinite}
.crt::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
.crt::after{content:'';position:absolute;left:0;right:0;height:22%;mix-blend-mode:screen;background:linear-gradient(180deg,transparent,rgba(150,190,255,.22),transparent);animation:roll 4.5s linear infinite}
@keyframes roll{from{transform:translateY(-120%)}to{transform:translateY(520%)}}
@keyframes cf{0%{opacity:.92}100%{opacity:1}}
.fz{position:absolute;left:68%;top:30%;width:32%;height:30%;overflow:hidden;pointer-events:none}
.fog{position:absolute;left:-50%;width:200%;height:55%;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 50%,rgba(120,150,255,.28),transparent 70%);animation:dr 45s linear infinite alternate}
@keyframes dr{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.crt,.crt::after,.fog{animation:none}}

.fit{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
.panel{position:absolute;left:0;top:0;width:620px;height:440px;transform-origin:0 0;pointer-events:auto;box-sizing:border-box;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
 font-family:'Press Start 2P',ui-monospace,monospace;color:#d8f6ff;
 background:radial-gradient(ellipse at 50% 40%,#10205a 0,#070b24 75%);
 box-shadow:inset 0 0 0 4px #1c4fd0,inset 0 0 0 8px #070b24,inset 0 0 0 10px #2fd0ff,inset 0 0 60px rgba(47,208,255,.25)}
.lvl{font-size:40px;color:#ffb23c;text-shadow:0 4px 0 #8a2a08,0 0 16px #ff7a1c}
.rule{width:60%;height:4px;background:repeating-linear-gradient(90deg,#2fd0ff 0 12px,transparent 12px 18px)}
.ask{margin:0;font-size:19px;line-height:1.8}.ask b{font-weight:400;font-size:23px;color:#ff5ad0;text-shadow:0 0 12px #ff3cd0}
.opts{display:flex;gap:40px;margin-top:6px}
.opt{--e:#1c8fb0;position:relative;font:inherit;font-size:24px;color:#d8f6ff;background:#0a1236;border:0;padding:16px 28px 16px 52px;cursor:pointer;
 box-shadow:0 -4px 0 0 var(--e),0 4px 0 0 var(--e),-4px 0 0 0 var(--e),4px 0 0 0 var(--e)}
.opt.on{--e:#ffb23c;color:#fff;background:#2a1408;text-shadow:0 0 10px #ff9a2c}
.opt::before{content:'';position:absolute;left:20px;top:50%;width:14px;height:16px;transform:translateY(-50%);background:var(--e);clip-path:polygon(0 0,100% 50%,0 100%);opacity:0}
.opt.on::before{opacity:1;animation:bk .6s steps(2) infinite}@keyframes bk{50%{opacity:0}}
.hint{font-size:10px;color:#6a8ad0}
.bar{width:360px;height:26px;background:#0a1030;position:relative;box-shadow:0 -4px 0 0 #2fd0ff,0 4px 0 0 #2fd0ff,-4px 0 0 0 #2fd0ff,4px 0 0 0 #2fd0ff}
.bar i{position:absolute;inset:5px;background:repeating-linear-gradient(90deg,#ffb23c 0 14px,#ff7a1c 14px 18px);transform-origin:0 50%;animation:fillb 2.2s steps(14) both}
@keyframes fillb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.opt.on::before,.bar i{animation:none}}
.cam{transform-origin:37.1% 43.7%}
.panel{overflow:hidden}
.pc{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px);image-rendering:pixelated}
.door{position:absolute;top:10px;bottom:10px;width:calc(50% - 10px);background:repeating-linear-gradient(0deg,#0a1236 0 18px,#0d1a4a 18px 22px);
 box-shadow:inset 0 0 0 4px #1c4fd0,inset 0 0 40px rgba(47,208,255,.2);animation:dop 1s steps(9) .45s both}
.door.l{left:10px;--x:-110%}.door.r{right:10px;--x:110%}
.door::after{content:'';position:absolute;top:0;bottom:0;width:6px;background:#2fd0ff;box-shadow:0 0 14px #2fd0ff}
.door.l::after{right:0}.door.r::after{left:0}
@keyframes dop{to{transform:translateX(var(--x))}}
#wipe{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;transition:opacity .5s}
#wipe.on{opacity:1}
</style></head><body>

 gl(255,367,24,'255,60,60',.2+btn*.35);
 x.globalCompositeOperation='source-over';
 x.save();x.beginPath();x.moveTo(...scr[0]);scr.slice(1).forEach(q=>x.lineTo(...q));x.closePath();x.clip();
 x.globalCompositeOperation='lighter';
 if(flash>.02){gl(hx,hy,70,'170,220,255',flash*.9);x.fillStyle=`rgba(120,160,255,${flash*.18})`;x.fillRect(100,60,420,300);flash*=.9}
 x.globalCompositeOperation='source-over';
 for(let i=SP.length-1;i>=0;i--){const s=SP[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.09;if(--s.l<=0){SP.splice(i,1);continue}
  x.globalAlpha=Math.min(1,s.l/14);x.fillStyle=s.c;x.fillRect(s.x|0,s.y|0,s.z,s.z)}
 x.restore();x.globalAlpha=1;
 // camera: handheld sway + hit shake

// ---- перспектива: прикріплюємо панель до екрана автомата ----
function homog(w,h,q){const s=[[0,0],[w,0],[w,h],[0,h]],A=[],b=[];
 for(let i=0;i<4;i++){const[X,Y]=s[i],[u,v]=q[i];A.push([X,Y,1,0,0,0,-X*u,-Y*u]);b.push(u);A.push([0,0,0,X,Y,1,-X*v,-Y*v]);b.push(v)}
 const n=8;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
  for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
 const z=Array(8);for(let i=n-1;i>=0;i--){let s2=b[i];for(let c=i+1;c<n;c++)s2-=A[i][c]*z[c];z[i]=s2/A[i][i]}
 const[a,bb,c,d,e,f,g,hh]=z;return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`}
const fit=document.getElementById('fit'),panel=document.getElementById('panel');
panel.style.transform=homog(620,440,[[330,190],[908,265],[930,618],[310,632]]);
const resize=()=>fit.style.transform=`scale(${cam.clientWidth/1672})`;
new ResizeObserver(resize).observe(cam);resize();

// ---- діалог ----
const YES_URL=''; // ← вставте сюди адресу сторінки гри, наприклад 'game.html'
const orig=panel.innerHTML;let sel=0,busy=false;
const opts=()=>panel.querySelectorAll('.opt');
const setSel=i=>{sel=i;opts().forEach((o,n)=>o.classList.toggle('on',n===i));btn=1};
function choose(i){if(busy)return;busy=true;
 if(i===0){hd=1;flash=1;shake=1;btn=1;boom(1,310,205);
  panel.innerHTML='<div class="lvl">ВХІД...</div><div class="bar"><i></i></div><p class="ask">Ласкаво просимо до<br><b>Верховної імперії</b></p>';
  setTimeout(openGate,2600)}
 else{btn=1;panel.innerHTML='<div class="lvl" style="font-size:26px">ПОВЕРНЕННЯ</div><p class="ask">Імперія зачекає на вас...</p>';
  setTimeout(()=>{if(window.parent!==window){parent.postMessage({type:'choice',value:'no'},'*');return}panel.innerHTML=orig;sel=0;busy=false},1800)}}
panel.addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)choose(+b.dataset.i)});
panel.addEventListener('mouseover',e=>{const b=e.target.closest('.opt');if(b&&!busy)setSel(+b.dataset.i)});
addEventListener('keydown',e=>{if(busy)return;
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){setSel(sel?0:1)}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(sel)}});

// ---- відкриття автомата і телепорт ----
let pctx=null,pimg=null,zoomStart=-1,openT=0;
const ZD=2400,ZMAX=4.8;
const PAL=[[5,2,12],[40,10,110],[106,43,255],[47,208,255],[255,60,200],[255,255,255]];
function zoomNow(t){if(zoomStart<0)return 1.015;const q=Math.min(1,Math.max(0,(t-zoomStart)/ZD));return 1.015+Math.pow(q,2.2)*ZMAX}
function openGate(){
 if(still)return finish();
 panel.innerHTML='<canvas class="pc" width="155" height="110"></canvas><div class="door l"></div><div class="door r"></div>';
 pctx=panel.querySelector('.pc').getContext('2d');pimg=pctx.createImageData(155,110);openT=performance.now();
 setTimeout(()=>{flash=1;shake=1;btn=1;boom(1,310,205)},450);        // двері починають розсуватись
 setTimeout(()=>{zoomStart=performance.now()},1700);                   // камера влітає в портал
 setTimeout(()=>document.getElementById('wipe').classList.add('on'),1700+ZD-450);
 setTimeout(finish,1700+ZD+300)}
function finish(){
 if(window.parent!==window){parent.postMessage({type:'choice',value:'yes'},'*');return}   // всередині гри: відповідь іде в гру
 if(YES_URL){location.href=YES_URL;return}
 pctx=null;zoomStart=-1;panel.innerHTML=orig;sel=0;busy=false;      // демо: повертаємось на початок
 document.getElementById('wipe').classList.remove('on')}
function drawPortal(t){
 const w=155,h=110,d=pimg.data,q=zoomStart<0?0:Math.min(1,(t-zoomStart)/ZD),core=.06+q*.95;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){
  const dx=(i-w/2)/(w/2),dy=(j-h/2)/(h/2),r=Math.sqrt(dx*dx+dy*dy)+1e-4;
  const s=Math.atan2(dy,dx)/6.2832*4+Math.log(r+.08)*1.7-t/800+Math.sin(r*9-t/300)*.05,f=s-Math.floor(s);
  let c=f<.2?1:f<.45?2:f<.7?3:f<.85?4:2;
  if(r>.8)c=Math.max(0,c-1);if(r>.97)c=0;
  if(r<core+.1)c=Math.max(c,4);if(r<core)c=5;
  const p=PAL[c],k=(i+j*w)*4;d[k]=p[0];d[k+1]=p[1];d[k+2]=p[2];d[k+3]=255}
 pctx.putImageData(pimg,0,0)}
</script></body></html>
