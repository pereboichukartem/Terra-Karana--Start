<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розвилка</title>
<style>
html,body{height:100%;margin:0;background:#04050c;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.cam{position:absolute;inset:0;transform:scale(1.03)}
.cam>img,.cam>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}30%{opacity:calc(var(--a)*.4)}50%{opacity:var(--a)}75%{opacity:calc(var(--a)*.6)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;--fc:150,245,255;
 background:repeating-linear-gradient(180deg,rgba(var(--fc),0) 0 6px,rgba(var(--fc),.9) 6px 9px,rgba(var(--fc),0) 9px 16px);background-size:100% 32px;animation:fall 1.2s linear infinite;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.fall.l{--fc:255,190,70;animation-duration:2.6s}.fall.r{--fc:255,150,150;animation-duration:1.8s}.fall.v{--fc:230,150,255}
@keyframes fall{to{background-position:0 32px}}
.rays{position:absolute;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(var(--rc),.9) 0 3deg,transparent 3deg 12deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 32%);mask-image:radial-gradient(circle,#000 0,transparent 32%);animation:ry 120s linear infinite,rb 7s ease-in-out infinite alternate}
@keyframes ry{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes rb{from{opacity:calc(var(--ro)*.55)}to{opacity:var(--ro)}}
.fz{position:absolute;overflow:hidden;pointer-events:none}
.fog{position:absolute;left:-40%;width:180%;height:100%;mix-blend-mode:screen;animation:dr 46s linear infinite alternate}
@keyframes dr{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.spin{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;pointer-events:none;opacity:.42;
 background:repeating-conic-gradient(from 0deg,rgba(255,120,255,.85) 0 14deg,rgba(80,220,255,.7) 14deg 28deg,transparent 28deg 58deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 68%);mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 68%);animation:sp 16s linear infinite}
.spin.s2{opacity:.28;animation-duration:27s;animation-direction:reverse;background:repeating-conic-gradient(from 20deg,rgba(255,255,255,.85) 0 7deg,transparent 7deg 38deg)}
@keyframes sp{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.rays,.fog,.spin{animation:none}}
</style></head><body>

 f.style.cssText=`background:radial-gradient(ellipse at 50% 50%,${col},transparent 70%);animation-duration:${dur}s;`+(rev?'animation-direction:alternate-reverse':'');z.append(f)});
if(C.rays){const[a,b,col,o]=C.rays;mkEl('rays',`left:${px(a,W)};top:${px(b,H)};--rc:${col};--ro:${o}`)}
if(C.spin){const[a,b,d]=C.spin;mkEl('spin',`left:${px(a,W)};top:${px(b,H)};width:${px(d,W)}`);mkEl('spin s2',`left:${px(a,W)};top:${px(b,H)};width:${px(d,W)}`)}
function dot(a,b,r,rgb,al){const g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,`rgba(${rgb},${al})`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(a-r,b-r,r*2,r*2)}
// спори
const S=C.spores,mkS=i=>{const s=S.src[i%S.src.length];return{x:s[0]*k+(R()-.5)*30,y:s[1]*k+(R()-.5)*14,vy:.12+R()*.3,p:R()*6,l:0,m:140+R()*180,c:s[2][R()*s[2].length|0],z:R()<.2?3:2}};
const SP=S?Array.from({length:S.n},(_,i)=>{const p=mkS(i);p.l=R()*p.m;return p}):[];
// мотики: float / ash / leaf
const MO=[],mkM=m=>{const b=m.box;return{m,x:(b[0]+R()*(b[2]-b[0]))*k,y:(b[1]+R()*(b[3]-b[1]))*k,p:R()*6,v:.05+R()*.15,z:R()<.25?3:2,c:m.mode==='leaf'?['#a6d62a','#5da02a','#d4e04a'][R()*3|0]:m.col}};
(C.motes||[]).forEach(m=>{for(let i=0;i<m.n;i++)MO.push(mkM(m))});
const ST=C.stars?Array.from({length:C.stars.n},()=>[(C.stars.box[0]+R()*(C.stars.box[2]-C.stars.box[0]))*k,(C.stars.box[1]+R()*(C.stars.box[3]-C.stars.box[1]))*k,R()*6]):[];
const A=["1.......1",".1.....1.",".11...11.","..11111..","....1...."],B=["....1....","..11111..",".11...11.","11.....11","1.......1"];
const FL=(C.flyers||[]).map(f=>({x:R()*CW*.5,...f})),PT=[],FIRE=['#fff2a0','#ffb030','#ff6a1c','#ff3a1c'];
const add=o=>PT.push(o);
function frame(t){t=t||0;x.clearRect(0,0,CW,CH);
 ST.forEach(s=>{x.globalAlpha=.3+.6*Math.sin(t/500+s[2]);x.fillStyle='#e8e0ff';x.fillRect(s[0]|0,s[1]|0,1,1)});
 x.globalCompositeOperation='lighter';
 MO.forEach(o=>{const m=o.m;o.p+=.01;
  if(m.mode==='float'){o.x+=Math.sin(o.p)*.15;o.y+=Math.cos(o.p*.8)*.1;dot(o.x,o.y,2.4,m.col,.35+.3*Math.sin(t/600+o.p*3))}
  else if(m.mode==='ash'){o.y-=o.v*1.3;o.x+=Math.sin(o.p*2)*.25;if(o.y<m.box[1]*k)o.y=m.box[3]*k;dot(o.x,o.y,2,m.col,.5)}
  if(o.x<0)o.x=CW;if(o.x>CW)o.x=0});
 x.globalCompositeOperation='source-over';
 SP.forEach((p,i)=>{p.l++;p.y-=p.vy;p.x+=Math.sin(p.l/22+p.p)*.25;if(p.l>p.m)Object.assign(p,mkS(i));x.globalAlpha=Math.sin(Math.PI*p.l/p.m)*.9;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.z,p.z)});
 MO.forEach(o=>{if(o.m.mode!=='leaf')return;o.y+=o.v*3.2;o.x+=Math.sin(t/800+o.p)*.4;if(o.y>CH){o.y=o.m.box[1]*k;o.x=(o.m.box[0]+R()*(o.m.box[2]-o.m.box[0]))*k}x.globalAlpha=.85;x.fillStyle=o.c;x.fillRect(o.x|0,o.y|0,o.z,o.z)});
 // джерела частинок
 (C.flames||[]).forEach(([a,b])=>{for(let n=0;n<2;n++)add({t:'f',x:a*k+(R()-.5)*5,y:b*k,vx:(R()-.5)*.3,vy:-.5-R()*.9,l:0,m:16+R()*14})});
 (C.jets||[]).forEach(([a,b,ang,sp,per,ph,kd])=>{if(((t/1000+ph)%per)<.9)for(let n=0;n<5;n++){const q=ang*Math.PI/180+(R()-.5)*(kd==='s'?.9:.35),v=sp*(.6+R()*.8);add({t:kd==='s'?'s':'f',x:a*k,y:b*k,vx:Math.cos(q)*v,vy:Math.sin(q)*v,l:0,m:kd==='s'?22+R()*14:18+R()*14,g:kd==='s'?.07:0})}});
 (C.smoke||[]).forEach(([a,b])=>{if(R()<.12)add({t:'m',x:a*k,y:b*k,vx:.08,vy:-.25,l:0,m:90})});
 (C.bubbles||[]).forEach(([a,b])=>{if(R()<.07)add({t:'b',x:a*k+(R()-.5)*14,y:b*k,vx:0,vy:-.3-R()*.3,l:0,m:50+R()*30,c:['#e8b8ff','#fff','#c07aff'][R()*3|0]})});
 (C.drops||[]).forEach(([a,b,e])=>{if(R()<.012)add({t:'d',x:a*k,y:b*k,vx:0,vy:0,e:e*k,l:0,m:999})});
 if(R()<.045){const pts=C.glints||[],ar=C.glintAreas||[],n=pts.length+ar.length;if(n){const i=R()*n|0;let a,b;if(i<pts.length){a=pts[i][0];b=pts[i][1]}else{const q=ar[i-pts.length];a=q[0]+R()*(q[2]-q[0]);b=q[1]+R()*(q[3]-q[1])}add({t:'g',x:a*k,y:b*k,vx:0,vy:0,l:0,m:30})}}
 for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l++;if(p.l>=p.m){PT.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;const u=p.l/p.m;
  if(p.t==='f'||p.t==='s'){if(p.g)p.vy+=p.g;x.globalAlpha=1-u;x.fillStyle=p.t==='s'?(u<.5?'#fff':'#ffc040'):FIRE[Math.min(3,u*4|0)];const z=p.t==='s'?2:(u<.5?3:2);x.fillRect(p.x|0,p.y|0,z,z)}
  else if(p.t==='m'){x.globalAlpha=1;dot(p.x,p.y,3+p.l*.07,'150,150,160',.2*(1-u))}
  else if(p.t==='b'){p.x+=Math.sin(p.l/6)*.2;x.globalAlpha=1-u*.6;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,2,2)}
  else if(p.t==='d'){p.vy+=.15;if(p.y>=p.e){p.t='r';p.l=0;p.m=14;p.vy=0;continue}x.globalAlpha=.9;x.fillStyle='#9ad8ff';x.fillRect(p.x|0,p.y|0,1,3)}
  else if(p.t==='r'){const w=1+p.l*.6|0;x.globalAlpha=1-u;x.fillStyle='#bfe8ff';x.fillRect(p.x-w|0,p.y|0,w*2+1,1)}
  else if(p.t==='g'){const a=Math.round(6*Math.sin(Math.PI*u));x.globalAlpha=1;x.fillStyle='#fff6d8';x.fillRect(p.x-a|0,p.y|0,a*2+1,1);x.fillRect(p.x|0,p.y-a|0,1,a*2+1)}}
 FL.forEach((b,i)=>{b.x+=b.s;if(b.x>CW*.9)b.x=-30;const yy=b.y+Math.sin(t/900+i*2)*b.a,fr=((t/(b.fast?120:260+i*40))|0)%2?A:B;x.globalAlpha=.9;x.fillStyle=b.col;
  fr.forEach((r,j)=>[...r].forEach((c,m)=>{if(c==='1')x.fillRect((b.x+m*b.sc)|0,(yy+j*b.sc)|0,b.sc,b.sc)}))});
 x.globalAlpha=1;
 const sw=C.sway||0;cam.style.transform=`translate(${(Math.sin(t/2100)*1.5).toFixed(1)}px,${(Math.cos(t/2500)*1.1).toFixed(1)}px) scale(${sw?1.05:1.03}) rotate(${(sw*Math.sin(t/2300)).toFixed(3)}deg)`;
 if(!still)requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
